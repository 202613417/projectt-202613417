
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow - Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="product.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main style="max-width:650px;margin:40px auto;padding:20px;">
    <h2>Checkout</h2>
    <h3>Order Summary</h3>

    <div id="checkout-items"></div>

    <h3>Total: AED <span id="checkout-total">0.00</span></h3>

    <h3>Customer Information</h3>

    <form id="checkout-form">
      <p>
        <input type="text" id="customer-name" aria-label="Full Name" maxlength="150"
          placeholder="Full Name" required>
      </p>

      <p>
        <input type="email" id="customer-email" aria-label="Email Address" maxlength="150"
          placeholder="Email Address" required>
      </p>

      <p>
        <input type="tel" id="customer-phone" aria-label="Phone Number" minlength="3" maxlength="30"
          placeholder="Phone Number" required>
      </p>

      <p>
        <textarea id="customer-address" aria-label="Delivery Address" minlength="5" maxlength="1000"
          placeholder="Delivery Address" required></textarea>
      </p>

      <button type="submit" id="place-order">
        Place Order
      </button>
    </form>

    <p id="checkout-message"></p>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ShopNow.</p>
  </footer>

  <script src="js/checkout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const form = document.getElementById("checkout-form");
    const button = document.getElementById("place-order");

    if (form) form.hidden = true;
    if (button) button.disabled = true;

    const user = await getCurrentUser();

    if (!user) {
      window.location.replace("login.html");
      return;
    }

    if (form) form.hidden = false;
    if (button) button.disabled = false;
  });
</script>
</body>
</html>
