<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow - Product details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a><a href="product.html">Products</a>
      <a href="about.html">About</a><a href="cart.html">Cart</a>
    </nav>
  </header>
  <main class="detail-container">
    <p><a href="product.html">Back to products</a></p>
    <p id="detail-message" role="status">Loading product...</p>
    <article id="detail" hidden>
      <h2 id="product-name"></h2>
      <p id="product-description"></p>
      <p id="product-category"></p>
      <p id="product-price"></p>
      <p id="product-stock"></p>
      <button id="detail-add" type="button" disabled>Add to Cart</button>
      <p id="detail-cart-message" role="status"></p>
      <p><a href="cart.html">View cart</a></p>
    </article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
